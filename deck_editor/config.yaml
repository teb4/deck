# Конфигурация Deck Editor
# Все числовые параметры можно менять без изменения кода.

# Максимальное количество строк payload в колоде (APPLY/DRY)
max_deck_lines: 5000

# Максимальное количество строк для CREATE (создание/полная замена файла)
max_create_lines: 50000

# Количество строк для отображения в diff-блоках (DRY/DRY_ALL)
diff_preview_lines: 10
